name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build and GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub Release
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "latest"
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.10"

      - name: Build Wheel & Source Dist
        run: uv build

      - name: Verify wheel version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::expected exactly one wheel in dist/, found ${#wheels[@]}"
            exit 1
          fi
          WHEEL_VERSION="$(unzip -p "${wheels[0]}" '*.dist-info/METADATA' | sed -n 's/^Version: //p' | head -n 1)"
          if [ "$WHEEL_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::wheel METADATA version '${WHEEL_VERSION}' does not match tag ${GITHUB_REF_NAME} (expected '${TAG_VERSION}')"
            exit 1
          fi
          echo "Wheel version ${WHEEL_VERSION} matches tag ${GITHUB_REF_NAME}"

      - name: Build release notes
        run: python3 scripts/release_notes.py --to "$GITHUB_REF_NAME" > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          body_path: release-notes.md

  docker:
    name: Build and push container image
    # Ship no image unless the GitHub Release job succeeded. The template repo
    # builds the image but never pushes it (it is internal and publishes nothing).
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read     # checkout
      packages: write    # push the image to GHCR
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
    env:
      PUBLISH: ${{ github.repository != 'christianclaudio/mcp-server-template' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (GHCR requires lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          # Provenance comes from the separate attest job; no buildx attestation
          # manifests (provenance or SBOM), so the pushed tag is a plain image manifest.
          provenance: false
          sbom: false
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          build-args: |
            UV_DYNAMIC_VERSIONING_BYPASS=${{ steps.version.outputs.version }}

  attest:
    name: Attest container image provenance
    # Separate job so the OIDC token and attestation rights never share a job
    # with the GHCR push credentials.
    needs: [docker]
    if: github.repository != 'christianclaudio/mcp-server-template'
    runs-on: ubuntu-latest
    permissions:
      contents: read       # required by attest-build-provenance
      id-token: write      # Sigstore signing certificate (OIDC)
      attestations: write  # store the attestation on GitHub
    steps:
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ needs.docker.outputs.image }}
          subject-digest: ${{ needs.docker.outputs.digest }}

  registry:
    name: Publish MCP Registry entry
    # Publish last, after the GitHub Release, GHCR and the attestation, so a
    # registry failure cannot skip any of them, and a re-run of this job retries
    # only the registry publish.
    # Product repos add their PyPI publish job here, so the registry entry is
    # published only after the PyPI package it lists exists.
    needs: [docker, attest]
    if: github.repository != 'christianclaudio/mcp-server-template'
    runs-on: ubuntu-latest
    permissions:
      contents: read     # checkout (server.json)
      id-token: write    # MCP Registry login (github-oidc)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install and Verify mcp-publisher
        run: |
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          ARCHIVE="mcp-publisher_${OS}_${ARCH}.tar.gz"
          curl -L -s -o "$ARCHIVE" "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/$ARCHIVE"
          curl -L -s -o checksums.txt "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/registry_1.8.1_checksums.txt"
          sha256sum --ignore-missing --check checksums.txt
          tar xz -f "$ARCHIVE" mcp-publisher
          rm "$ARCHIVE" checksums.txt

      - name: Authenticate to MCP Registry
        run: |
          MAX_RETRIES=3
          for ATTEMPT in $(seq 1 "$MAX_RETRIES"); do
            if ./mcp-publisher login github-oidc; then
              break
            fi
            if [ "$ATTEMPT" -eq "$MAX_RETRIES" ]; then
              echo "mcp-publisher login failed after $MAX_RETRIES attempts" >&2
              exit 1
            fi
            echo "mcp-publisher login failed (attempt $ATTEMPT/$MAX_RETRIES), retrying in 5s..."
            sleep 5
          done

      - name: Set version in server.json
        # Stamp the tag version into the server, each versioned package, and the
        # OCI identifier's tag (OCI packages carry the version in the identifier).
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '
            .version = $v
            | .packages |= map(
                if .registryType == "oci"
                then .identifier = (.identifier | sub(":[^:/]+$"; "") + ":" + $v)
                else .version = $v end)
          ' server.json > server.tmp && mv server.tmp server.json

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
