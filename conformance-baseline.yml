# MCP Conformance Test Suite - Expected Failures Baseline
# Reference: https://github.com/modelcontextprotocol/conformance
#
# Each scenario below fails for one of two reasons, neither a defect in this server:
# 1. It calls a feature this server does not declare, and the server answers
#    -32601 Method not found as the spec requires: completion-complete (no
#    completions capability) and resources-subscribe / resources-unsubscribe
#    (resources.subscribe is false).
# 2. It calls the conformance suite's own reference-server fixtures (e.g.
#    test_image_content, test_audio_content, test://static-text,
#    test_simple_prompt), which this server does not have: the other 17
#    tools-call-*, elicitation-*, resources-read-* / resources-templates-read
#    and prompts-get-* scenarios.

server:
  - completion-complete
  - tools-call-image
  - tools-call-audio
  - tools-call-embedded-resource
  - tools-call-mixed-content
  - tools-call-with-logging
  - tools-call-with-progress
  - tools-call-sampling
  - tools-call-elicitation
  - elicitation-sep1034-defaults
  - elicitation-sep1330-enums
  - resources-read-text
  - resources-read-binary
  - resources-templates-read
  - resources-subscribe
  - resources-unsubscribe
  - prompts-get-simple
  - prompts-get-with-args
  - prompts-get-embedded-resource
  - prompts-get-with-image
